name: VM6 Same SHA Failed Tests
on:
  pull_request:
    branches:
      - main
      - vm6-same-sha-alt2-20260917
permissions:
  contents: read
jobs:
  failed-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Produce failed-tests artifact from trusted PR base context
        env:
          VM6_BASE_REF: ${{ github.base_ref }}
        shell: python
        run: |
          import os
          from pathlib import Path
          base = os.environ["VM6_BASE_REF"]
          failures = ["tests/test_vm6_required.py::test_required"] if base == "main" else []
          Path("failed-tests.txt").write_text("\n".join(failures) + ("\n" if failures else ""))
          print(f"VM6_BASE_REF={base}")
          print(f"VM6_FAILURE_COUNT={len(failures)}")
      - uses: actions/upload-artifact@v4
        with:
          name: failed-tests
          path: failed-tests.txt
          if-no-files-found: error
